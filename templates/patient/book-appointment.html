<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Barangay Health Center</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/patient/book-appointment-style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <i class="fas fa-hand-holding-medical"></i>
            <span>Barangay <br> Health Center</span>
        </div>
        <a href="{{ url_for('profile') }}" class="user-profile-link">
            <div class="user-profile-mini">
                <i class="fas fa-user-circle"></i>
                <span>{{ patient_name }}</span>
            </div>
        </a>
    </header>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="nav-list">
                <a href="{{ url_for('patient_dashboard') }}" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="{{ url_for('profile') }}" class="nav-item"><i class="fas fa-id-card"></i> My Profile</a>
                <a href="{{ url_for('book_appointment') }}" class="nav-item"><i class="fas fa-calendar-alt"></i> Book Appointment</a>
                <a href="{{ url_for('my_appointments') }}" class="nav-item"><i class="fas fa-list-ol"></i> My Appointment</a>
                <a href="{{ url_for('queue') }}" class="nav-item"><i class="fas fa-bell"></i> Queue Status</a>
                <a href="{{ url_for('notifications') }}" class="nav-item"><i class="fas fa-file-medical"></i> Notifications</a>
            </div>
            <a href="{{ url_for('logout') }}" class="nav-item logout-bottom"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </aside>

        <main class="main-panel">
            <div class="header-container-flex">
                <div class="header-text">
                    <h1>BOOK APPOINTMENT</h1>
                    <p class="description">Schedule your next visit to the health center.</p>
                </div>
                <button class="btn-add-appointment">
                    <i class="fas fa-plus"></i> Book New Appointment
                </button>
            </div>

            <form method="POST" action="{{ url_for('book_appointment') }}">
                <div class="form-group">
                    <label for="service">Select Service</label>
                    <select id="service" name="service_type" class="form-control">
                        <option>General Consultation</option>
                        <option>Prenatal Checkup</option>
                        <option>Child Immunization</option>
                        <option>Dental Checkup</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Preferred Date</label>
                    <input type="date" id="date" name="date" class="form-control">
                </div>

                <div class="form-group">
                    <label>Available Time Slots</label>
                    <div class="time-grid">
                        <label><input type="radio" name="time" value="9:00 AM"> 9:00 AM</label>
                        <label><input type="radio" name="time" value="10:00 AM"> 10:00 AM</label>
                        <label><input type="radio" name="time" value="11:00 AM"> 11:00 AM</label>
                        <label><input type="radio" name="time" value="1:00 PM"> 1:00 PM</label>
                        <label><input type="radio" name="time" value="2:00 PM"> 2:00 PM</label>
                        <label><input type="radio" name="time" value="3:00 PM"> 3:00 PM</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reason">Reason for visit (optional)</label>
                    <textarea id="reason" name="reason" class="form-control" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="priority">Priority category</label>
                    <select id="priority" name="priority" class="form-control">
                        <option>None</option>
                        <option>Senior Citizen</option>
                        <option>PWD</option>
                        <option>Pregnant</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-confirm">Confirm Appointment</button>
                    <button type="reset" class="btn btn-cancel">Cancel</button>
                </div>
            </form>

            <footer class="content-footer">
                Barangay Health Center © 2026
            </footer>
        </main>
    </div>

</body>
</html>
